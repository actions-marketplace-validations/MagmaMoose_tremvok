name: 'Tremvok'
description: 'Deploy anything: GitHub Pages, Cloudflare Workers, Azure Functions, AWS S3/CloudFront & Lambda, Terragrunt, and Ansible.'
author: 'MagmaMoose'

branding:
  icon: 'upload-cloud'
  color: 'green'

# ─────────────────────────────────────────────────────────────────────────────
# One action, several deployment targets, selected by `target`.
#
# The objection to a target enum is that a listing full of values which error is a
# listing that cannot say what it does. The answer is the first step of this action:
# every input is checked against the selected target, and an input that does not apply
# to it is a HARD ERROR naming the target, never a silent no-op. `target: ansible`
# with `s3-bucket` set is a mistake, and it is reported as one.
#
# Input names carry their target as a prefix (`pages-`, `s3-`, `cloudfront-`,
# `lambda-`, `terragrunt-`, `ansible-`, `functions-`, `apim-`), with `aws-` and `azure-` for what
# each cloud's targets share, `build-` for what the two targets that run a build share,
# and no prefix for what every target shares. The mapping is generated from the
# descriptions below into scripts/lib/input-targets.json, which is what the validator
# reads and what `tests/test_input_targets.py` keeps honest.
#
# The logic lives in `scripts/*.sh`, which are bats-tested; this file is glue.
# ─────────────────────────────────────────────────────────────────────────────
inputs:

  # ── What to deploy ───────────────────────────────────────────────────────
  target:
    description: |
      The deployment target. One of:
        github-pages   Build an MkDocs site strictly and publish it to GitHub Pages.
        s3-cloudfront  Sync a built static site to S3 and invalidate CloudFront.
        lambda-zip     Publish a Lambda package to S3, update the function, move an alias.
        terragrunt     Discover, plan and (on an approval) apply Terragrunt stacks.
        ansible        Run an Ansible playbook over SSH, then prove it is idempotent.
        cloudflare-workers  Deploy a Worker and its static assets with Wrangler.
        cloudflare-docs     Build an MkDocs site strictly and publish it to Cloudflare
                            Workers Static Assets, behind the docs router.
        azure-functions-zip  Publish a zip to an Azure Function App, then wait for it to answer.
        azure-apim-policy    Publish policy documents to an existing Azure API Management API,
                             putting the previous ones back if any is refused.
    required: true

  mode:
    description: |
      What this run should do. One of:
        auto     (default) push to the default branch = deploy, pull_request = preview,
                 workflow_dispatch = deploy (pinned to the default branch).
        deploy   Publish to the environment.
        preview  Publish somewhere disposable; production is untouched.
        rollback Re-publish a previously published version.
    required: false
    default: 'auto'

  environment:
    description: 'Logical environment name, surfaced in notifications and the deployment record. Defaults to "production" (deploy) or "preview".'
    required: false
    default: ''

  working-directory:
    description: 'Directory to run in. Paths in the other inputs are relative to it.'
    required: false
    default: '.'

  checkout:
    description: 'Run actions/checkout first. Set false if the caller already checked out.'
    required: false
    default: 'true'

  dry-run:
    description: 'Resolve, plan and report without changing anything.'
    required: false
    default: 'false'

  # ── AWS (every target that talks to AWS) ─────────────────────────────────
  aws-region:
    description: 's3-cloudfront, lambda-zip, terragrunt: AWS region. Falls back to the AWS_REGION environment variable.'
    required: false
    default: ''

  aws-role-to-assume:
    description: |
      s3-cloudfront, lambda-zip, terragrunt: IAM role ARN to assume with this run's GitHub
      OIDC token. Strongly preferred over stored keys: the credential expires in an hour and
      the role's trust policy decides which repository and ref may use it. Requires
      `permissions: id-token: write`. Leave empty to use credentials an earlier step
      already configured.
    required: false
    default: ''

  aws-role-duration-seconds:
    description: 's3-cloudfront, lambda-zip, terragrunt: lifetime of the assumed-role session.'
    required: false
    default: '3600'

  # ── Azure (every target that talks to Azure) ─────────────────────────────────
  azure-client-id:
    description: |
      terragrunt, azure-functions-zip, azure-apim-policy: client id of the Entra ID app registration this run
      signs in as, using the run's GitHub OIDC token. The Azure counterpart of
      `aws-role-to-assume`, and preferred over a stored publish profile or client secret for
      the same reasons: the session is minted per run and expires, and the app registration's
      federated credential decides which repository and which ref may mint one. A publish
      profile is a long-lived file carrying the deployment rights of the whole site, tied to
      nothing. Requires `permissions: id-token: write`. Leave empty to use a session an
      earlier step created.

      On `terragrunt` this is the PROVIDER's credential and has nothing to do with the state
      backend's, which `terragrunt-stack-env` carries. `provider "azurerm"` with no explicit
      auth falls through its default chain to the Azure CLI, so a run with a perfectly good
      ARM_ACCESS_KEY still fails at plan on a runner nobody signed in.
    required: false
    default: ''

  azure-tenant-id:
    description: 'terragrunt, azure-functions-zip, azure-apim-policy: Entra ID tenant the app registration lives in. Required whenever `azure-client-id` is set.'
    required: false
    default: ''

  azure-subscription-id:
    description: 'terragrunt, azure-functions-zip, azure-apim-policy: subscription to select after login. Required whenever `azure-client-id` is set. On terragrunt it is the CLI default a stack inherits when its own provider block names no subscription.'
    required: false
    default: ''

  # ── Google Cloud (every target that talks to GCP) ────────────────────────────
  gcp-workload-identity-provider:
    description: |
      terragrunt: full resource name of the workload identity pool provider this run
      federates with, `projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>`.
      The Google counterpart of `aws-role-to-assume` and `azure-client-id`, and preferred over
      a downloaded service-account key for the same reasons: the credential is minted per run
      and expires, and the pool provider's attribute condition decides which repository and
      which ref may mint one. A service-account key is a long-lived file, valid until somebody
      deletes it, tied to nothing. Requires `permissions: id-token: write`. Leave empty to use
      credentials an earlier step created.

      On `terragrunt` this is the PROVIDER's credential. If your state lives in GCS the
      backend needs one too, and the same federated credentials serve both.
    required: false
    default: ''

  gcp-service-account:
    description: |
      terragrunt: service account to impersonate after federating, `name@project.iam.gserviceaccount.com`.
      Empty (default) uses the federated identity directly, which works when the IAM bindings
      name the pool's `principalSet` rather than a service account. Set, the pool's principalSet
      needs `roles/iam.workloadIdentityUser` on it.
    required: false
    default: ''

  gcp-project-id:
    description: 'terragrunt: project exported as GOOGLE_PROJECT and GOOGLE_CLOUD_PROJECT, for configurations that do not name one themselves. Optional.'
    required: false
    default: ''

  # ── target: github-pages ─────────────────────────────────────────────────────────
  pages-toolchain:
    description: |
      github-pages, cloudflare-docs: how to install MkDocs, auto (default) | uv | pip. `auto` picks uv when a uv.lock
      is present, otherwise pip against `pages-requirements`. Detection exists so a caller does
      not have to declare per-repo what is already visible in the repo.
    required: false
    default: 'auto'

  pages-dependency-group:
    description: 'github-pages, cloudflare-docs: uv dependency-group holding the docs tooling (uv toolchain only).'
    required: false
    default: 'docs'

  pages-requirements:
    description: 'github-pages, cloudflare-docs: requirements file pinning the docs build (pip toolchain only).'
    required: false
    default: 'docs/requirements.txt'

  pages-python-version:
    description: 'github-pages, cloudflare-docs: Python version used to build the site.'
    required: false
    default: '3.12'

  pages-strict:
    description: |
      github-pages, cloudflare-docs: build with `--strict`, so a broken internal link or a nav entry pointing at a
      missing file fails rather than publishing a site with holes in it.
    required: false
    default: 'true'

  pages-site-dir:
    description: 'github-pages, cloudflare-docs: directory the built site is written to.'
    required: false
    default: 'site'

  pages-lint:
    description: |
      github-pages, cloudflare-docs: run the repo-shape checks (README budget and section order, licence agreement,
      link targets, Marketplace preflight, INHERIT clobber) before building. These are the
      rules nothing else covers; --strict already catches broken internal links.
    required: false
    default: 'true'

  pages-profile:
    description: 'github-pages, cloudflare-docs: repo profile for the shape checks, auto | action | service | spec.'
    required: false
    default: 'auto'

  pages-readme-budget:
    description: 'github-pages, cloudflare-docs: override the README line budget. 0 uses the profile default.'
    required: false
    default: '0'

  pages-markdownlint:
    description: |
      github-pages, cloudflare-docs: run markdownlint-cli2 over docs/ and README.md when a markdownlint config is
      present. Runs here rather than under MegaLinter because MegaLinter's `security` flavor
      carries no markdown linter, and MARKDOWN_MARKDOWNLINT emits no SARIF, so it could never
      gate on net-new findings anyway.
    required: false
    default: 'true'

  pages-seo:
    description: |
      github-pages, cloudflare-docs: after the build, give every page its own meta description
      (from its first paragraph of prose; the home page keeps `site_description`), Open Graph
      and Twitter tags, a JSON-LD graph (WebSite, TechArticle, BreadcrumbList) and a markdown
      copy at `<page>/index.md`, linked from the page and from llms.txt. Configured by
      `extra.seo` in mkdocs.yml (`locale`, `image`, `publisher`, `author`, `twitter`), every
      key optional. A tag a page already carries is never replaced or doubled, so a site with
      its own SEO hook keeps it. `false` skips the step.
    required: false
    default: 'true'

  pages-agent-ready:
    description: |
      github-pages, cloudflare-docs: after the build, make the site agent-ready. Writes an Agent
      Skills index at `/.well-known/agent-skills/index.json` with one skill that says what the
      site covers and how to read and cite it; loads WebMCP tools on every page (search the
      docs, read a page as markdown, list and open pages) from a same-origin script that does
      nothing in a browser without the API; and, for a public site served at the root of its
      host, writes an `/auth.md` saying the docs need no credentials, never for a site behind
      `cloudflare-docs-require-access`. Configured by `extra.agents` in mkdocs.yml (`mcp`,
      `skill`, `webmcp`, `auth_md`), every key optional. Anything the site already publishes of
      these is left alone. On github-pages the artifact then includes dot-directories, which is
      where the index lives. `false` skips the step.
    required: false
    default: 'true'

  # ── targets that run a build: github-pages, cloudflare-workers ───────────
  build-git-credentials:
    description: |
      github-pages, cloudflare-workers, cloudflare-docs: credentials for the private git hosts the build fetches
      from, one `<host> <username>:<token>` per line. Empty (default) changes nothing.

        git.example.invalid  x-access-token:<a short-lived token>

      A docs build that installs its theme with `pkg @ git+https://<host>/<org>/<repo>.git@<tag>`
      needs that clone authenticated, and the clone is git's own, several processes below this
      action. Each line becomes one `url.<credentialled>.insteadOf` rewrite carried in
      GIT_CONFIG_COUNT / GIT_CONFIG_KEY_n / GIT_CONFIG_VALUE_n for the rest of this job, so the
      requirements file keeps pinning the plain URL and stays reviewable. Never
      `git config --global`: a self-hosted runner is shared and long-lived, and a global rewrite
      would leave the token in `~/.gitconfig` for whatever runs on that machine next.

      The username is written out rather than assumed, because the forges disagree about it:
      `x-access-token` for a GitHub App token, `oauth2` for a GitLab one. The split is at the
      FIRST `:`, which is the safe way round — the username is the half that cannot contain one,
      so a token that does survives intact.

      Every token is masked on receipt and never echoed. A malformed line is refused by index
      and host, and the host is only quoted when it looks like one, because a bare token pasted
      as a line would otherwise be printed into an annotation as public as the repository. Blank
      lines and `#` comments are ignored.
    required: false
    default: ''

  # ── targets: s3-cloudfront, lambda-zip ───────────────────────────────────
  artifact-path:
    description: 's3-cloudfront, lambda-zip, cloudflare-workers, azure-functions-zip, azure-apim-policy: the built artifact, a directory for s3-cloudfront, a .zip for lambda-zip and azure-functions-zip, and for azure-apim-policy a directory of policy documents: `api.xml` for the API scope and `<operation-id>.xml` for each operation.'
    required: false
    default: ''

  s3-bucket:
    description: 's3-cloudfront, lambda-zip: the bucket. For s3-cloudfront it serves the site; for lambda-zip it holds published artifacts.'
    required: false
    default: ''

  s3-key-prefix:
    description: 's3-cloudfront, lambda-zip: key prefix within the bucket. Previews are placed under `<s3-key-prefix>/previews/<alias>/`.'
    required: false
    default: ''

  # ── target: s3-cloudfront ────────────────────────────────────────────────
  s3-delete-orphans:
    description: 's3-cloudfront: pass --delete to `aws s3 sync`, removing bucket objects with no local counterpart. `auto` (default) means yes.'
    required: false
    default: 'auto'

  cloudfront-distribution-id:
    description: 's3-cloudfront: CloudFront distribution to invalidate after the sync. Empty means no invalidation, the CDN keeps serving the old objects until its TTL expires.'
    required: false
    default: ''

  cloudfront-site-url:
    description: 's3-cloudfront: base URL the distribution serves, used to build the URL reported in notifications.'
    required: false
    default: ''

  # ── target: lambda-zip ───────────────────────────────────────────────────
  lambda-function-name:
    description: 'lambda-zip: the function to update.'
    required: false
    default: ''

  lambda-function-alias:
    description: 'lambda-zip: the alias moved to the new version in deploy mode. A preview publishes a version and does not move it.'
    required: false
    default: 'live'

  lambda-version-label:
    description: 'lambda-zip: names the immutable S3 key (`<s3-key-prefix>/<lambda-version-label>.zip`). Defaults to the short commit SHA.'
    required: false
    default: ''

  # ── target: terragrunt ───────────────────────────────────────────────────
  terragrunt-root:
    description: 'terragrunt: directory the stacks live under.'
    required: false
    default: 'terraform'

  terragrunt-exclude:
    description: |
      terragrunt: space-separated path segments that never hold a stack. `modules _modules`
      by default: a module has no state of its own, and guessing which stacks use it from a
      path is how a small module tidy-up ends up planning the whole estate. Add a stack that
      must only ever be applied by hand, one that rewrites a firewall wholesale, say, and
      the pipeline will not touch it.
    required: false
    default: 'modules _modules'

  terragrunt-scope:
    description: |
      terragrunt: `auto` (changed stacks on a PR/push, all on a schedule or dispatch), `all`,
      or `changed`. With `terragrunt-pull-request` set, `auto` means the stacks that pull
      request touches even on a manual run; `all` stays legal and means plan the whole estate,
      gate on that pull request's approval, comment on that pull request.
    required: false
    default: 'auto'

  terragrunt-pull-request:
    description: |
      terragrunt: act on this pull request number instead of the one in the event payload.
      For a manual run that has to plan a named pull request. Its reviews are what the
      approval gate reads, its thread is where the plan comment goes, and its head commit is
      what the check run is published against, fetched from the API because a dispatch event
      carries no pull request. Empty (default) uses the event, which is every automatic run.
      Digits only. A manual run plans: dispatching a workflow is not approving a commit, so
      `terragrunt-apply: force` is what applies one by hand.

      Checking out the right tree stays yours: pass `ref: refs/pull/<n>/merge` to your own
      actions/checkout step and set `checkout: false` here, or the run plans whatever is on
      disk and says so.
    required: false
    default: ''

  terragrunt-apply:
    description: |
      terragrunt: `auto` (apply on an independent approval), `never` (plan only), or `force`.
      Under `auto` the run must also be the event that asks for an apply: a pull-request review
      that is an approval, or a push with `terragrunt-apply-on-merge` on. A run that only finds
      an approval already standing plans and reports, because that approval was given for the
      commit it was given for and a commit pushed after it has not been reviewed. Re-approving
      applies. `force` skips the approval and is restricted to `terragrunt-apply-operators`.
    required: false
    default: 'auto'

  terragrunt-apply-on-merge:
    description: |
      terragrunt: `true` lets a push to the default branch apply what was merged. `false`
      (the default) plans on a push and applies nothing, which is what this target has always
      done.

      A push event carries no pull request, so with this on the run asks the API which pull
      request the commit was merged from and reads that pull request's reviews: a merge that
      had an independent approval applies, a merge without one is reported and not applied.
      Off, none of that happens: no commit-to-pull-request lookup, no approval read, plan
      only.

      Separate from `terragrunt-apply` on purpose. That input answers "who may authorise an
      apply?"; this one answers "should a merge commit apply at all?". Stacking the two
      questions into one enum makes both harder to read.
    required: false
    default: 'false'

  terragrunt-apply-operators:
    description: |
      terragrunt: comma-separated GitHub logins allowed to force an apply by hand
      (`terragrunt-apply: force` on a manual run). Empty means nobody can, so the manual path
      fails closed. The normal path is an independent pull-request approval and needs nothing
      here.
    required: false
    default: ''

  terragrunt-stack-env:
    description: |
      terragrunt: environment applied per stack, one `<glob> KEY=VALUE` per line. The first
      matching line wins for a given KEY, so a specific pattern goes above the catch-all
      exactly as it would in a `case`. Blank lines and `#` comments are ignored.

        */prd/*|*/prod/*  ARM_ACCESS_KEY=<the production state key>
        *                 ARM_ACCESS_KEY=<the shared state key>

      For an estate whose production state lives in a separate account from the rest, which
      is a deliberate blast-radius boundary rather than an accident: one credential cannot
      reach both, and without this the only options are a job per credential class or a
      pipeline that fails on the first stack of the other kind. The values are secrets, so
      they are passed to each run with `env` rather than exported into the shell, and one
      stack's credential never reaches the next stack's run. A malformed line is refused by
      index, glob and KEY: nothing at or after the first `=` is ever printed, because the
      annotation it would appear in is as public as the repository.
    required: false
    default: ''

  terragrunt-check-name:
    description: 'terragrunt: name of the check run published against the head commit. Make it a required check to enforce apply-before-merge.'
    required: false
    default: 'Terragrunt apply'

  terragrunt-install:
    description: |
      terragrunt: install pinned, checksum-verified tofu and terragrunt binaries before
      running, `auto` (default) installs only what is not already on PATH, `always`
      reinstalls, `never` uses whatever the runner provides. The download is cached per
      version pair, so a bump lands in a new directory and can never pick up a stale binary.
    required: false
    default: 'auto'

  terragrunt-version:
    description: 'terragrunt: the Terragrunt version to install and run.'
    required: false
    default: '1.0.8'

  terragrunt-tofu-version:
    description: 'terragrunt: the OpenTofu version to install and run under Terragrunt.'
    required: false
    default: '1.12.1'

  terragrunt-plugin-cache:
    description: |
      terragrunt: directory to persist provider plugins in across stacks and runs, exported as
      TF_PLUGIN_CACHE_DIR. The workspace is wiped on each checkout, so without it every stack
      re-downloads every provider, the single biggest cost in a multi-stack run. Empty
      disables the cache.
    required: false
    default: '~/.terraform-plugin-cache'

  terragrunt-refresh:
    description: |
      terragrunt: refresh state from the provider before planning, `auto` (default) skips the
      refresh on a pull request and keeps it everywhere else, `true` always refreshes, `false`
      never does. Config-versus-state is enough for a pull-request check; the scheduled drift
      run is the one that has to ask the provider.
    required: false
    default: 'auto'

  terragrunt-timeout:
    description: 'terragrunt: seconds any one init, plan or apply may take before it is killed. 0 disables the timeout. A stalled provider call otherwise looks like a silent hang until the job limit.'
    required: false
    default: '900'

  terragrunt-preflight-urls:
    description: |
      terragrunt: URLs to probe for reachability before the first plan, one per line. Empty
      (default) probes nothing.

      Terragrunt buffers plan output to a file, so a state backend or provider API the runner
      cannot reach is a silent wait until `terragrunt-timeout` rather than an error. One
      8-second request per URL turns that into a red step naming the endpoint.

        https://<your-state-backend-host>/?comp=list
        https://<your-provider-api-host>/api/versions

      The rules worth knowing before you read a result: a code of 000 (DNS, connect, TLS or
      timeout) fails the run; any HTTP answer passes, 401 and 403 included, because an
      unauthenticated probe of a credentialed endpoint is supposed to be refused and being
      refused proves the endpoint is there. This proves reachability, not authorisation: a
      403 does not mean the credential works. Blank lines and `#` comments are ignored. Put
      no credentials in these URLs; they are printed into the run log. A URL carrying
      userinfo is refused, and the refusal names the line by its index and shows the URL with
      the userinfo replaced rather than echoing the line.
    required: false
    default: ''

  terragrunt-credential-preflight:
    description: |
      terragrunt: check that every cloud the discovered stacks name has a credential on this
      runner, before the first plan. `auto` (default) fails the run, `warn` annotates and
      plans anyway, `off` checks nothing.

      Exists because the credential a terragrunt run needs is not one credential. The state
      backend has its own (`terragrunt-stack-env`), and every `provider` block the stacks
      declare has another, from a different chain, that nothing in the workflow mentions. The
      failure that produces is the least readable in this action: state reads fine, init
      succeeds, and the plan dies inside a provider with `could not configure AzureCli
      Authorizer: … Please run 'az login'`, twenty stacks in a row, which reads as a broken
      runner rather than as a credential nobody wired.

      What it reads: the `provider "<name>"` blocks in each discovered stack and in every
      parent directory up to `terragrunt-root`, so a `generate` block in a shared root.hcl
      counts. What it knows: azurerm/azuread/azapi, aws, google/google-beta, vcd. A provider
      it does not recognise is passed over in silence rather than guessed at.

      The state backend is deliberately not checked. A backend with no credential fails in
      `init`, immediately, naming the backend, which is already the good failure; and an
      ARM_ACCESS_KEY opens one storage account and cannot configure a provider, so counting
      it either way would be wrong.

      What it will NOT report: a provider block that configures its own authentication
      (`client_id`, `client_secret`, `use_oidc`, `use_msi`, `access_key`, `credentials`,
      `token`, `api_token` …), because that stack answers the question itself. That is the
      exemption that keeps this from being a check people turn off.

      This proves a credential is present, never that it is valid or that it can reach the
      subscription, project or account the stack names — the same distinction
      `terragrunt-preflight-urls` draws between reachable and authorised.
    required: false
    default: 'auto'

  terragrunt-log-level:
    description: 'terragrunt: value for TF_LOG when diagnosing a stuck provider call (debug, trace). Empty (default) leaves provider logging off; the log is written next to the plan and redacted before it is shown.'
    required: false
    default: ''

  terragrunt-extra-args:
    description: 'terragrunt: extra flags appended to every plan and apply, split on whitespace.'
    required: false
    default: ''

  # ── target: ansible ──────────────────────────────────────────────────────
  ansible-playbook:
    description: 'ansible: path to the playbook to run, relative to working-directory. Required for this target.'
    required: false
    default: ''

  ansible-inventory:
    description: 'ansible: inventory path or comma-separated host list passed to `-i`. Required for this target.'
    required: false
    default: ''

  ansible-version:
    description: 'ansible: exact version of the `ansible` PyPI distribution to install. Pinned rather than floating, because a collection that changes behaviour between releases is indistinguishable from a change you made.'
    required: false
    default: '11.1.0'

  ansible-python-version:
    description: 'ansible: Python version the control node runs on.'
    required: false
    default: '3.12'

  ansible-galaxy-requirements:
    description: 'ansible: path to a galaxy requirements file installed with `ansible-galaxy install -r` before the run. Empty skips it.'
    required: false
    default: ''

  ansible-limit:
    description: 'ansible: value for `--limit`, restricting the run to a subset of the inventory.'
    required: false
    default: ''

  ansible-tags:
    description: 'ansible: value for `--tags`.'
    required: false
    default: ''

  ansible-skip-tags:
    description: 'ansible: value for `--skip-tags`.'
    required: false
    default: ''

  ansible-check:
    description: |
      ansible: run in check mode, `auto` (default) means check mode on a pull request and a
      real run everywhere else, `true` forces check mode, `false` forces a real run. A pull
      request that silently reconfigured a fleet would be a surprising way to find out what a
      diff does.
    required: false
    default: 'auto'

  ansible-diff:
    description: 'ansible: pass `--diff`, so the log shows what each changed task changed.'
    required: false
    default: 'true'

  ansible-extra-vars:
    description: 'ansible: value for `--extra-vars`. Accepts `key=value` pairs or JSON.'
    required: false
    default: ''

  ansible-extra-args:
    description: 'ansible: extra flags appended to the playbook run, split on whitespace.'
    required: false
    default: ''

  ansible-ssh-private-key:
    description: |
      ansible: SSH private key used to reach the inventory. Pass a secret, never a literal. It
      is masked on receipt, written to a 0600 file under RUNNER_TEMP, and removed when the step
      exits however it exits.
    required: false
    default: ''

  ansible-ssh-user:
    description: 'ansible: value for `--user`. Leave empty to let the inventory or ansible.cfg decide.'
    required: false
    default: ''

  ansible-ssh-known-hosts:
    description: |
      ansible: known_hosts entries for the inventory, one per line. Empty means host-key
      checking is disabled for the run, which is a real downgrade, supply this for anything
      reachable from a network you do not control.
    required: false
    default: ''

  ansible-vault-password:
    description: 'ansible: vault password. Pass a secret. Masked on receipt, written to a 0600 file under RUNNER_TEMP, removed when the step exits.'
    required: false
    default: ''

  vault-addr:
    description: |
      ansible: base URL of a HashiCorp Vault, e.g. `https://vault.example.com:8200`. Set it,
      with `vault-token`, to name secrets by Vault reference instead of passing them in. Only
      the fields you reference are read.
    required: false
    default: ''

  vault-token:
    description: 'ansible: Vault token the references are read with. Pass a secret. Needs read on the paths you reference and nothing else.'
    required: false
    default: ''

  vault-namespace:
    description: 'ansible: Vault namespace (Enterprise). Empty is correct for open-source Vault.'
    required: false
    default: ''

  ansible-vault-passthrough:
    description: |
      ansible: hand `VAULT_ADDR`, `VAULT_TOKEN` and `VAULT_NAMESPACE` to the ansible-playbook
      process, so the playbook can read its own secrets from the same HashiCorp Vault rather
      than having them copied into a second store that quietly stops being rotated. Needs
      `vault-addr` and `vault-token`; without both, nothing is passed.

      `false` by default, and the default removes them from the playbook's environment. A
      token scoped to the fields this action reads becomes a token every task, role and
      collection in the play can use, and widening a credential's blast radius should be a
      decision rather than something inherited by accident. Nothing to do with ansible-vault,
      the file-encryption tool; that is `ansible-vault-password`.
    required: false
    default: 'false'

  ansible-ssh-private-key-vault:
    description: |
      ansible: Vault reference to the SSH private key, `<path>#<field>`, e.g.
      `secret/data/team/app#ssh_private_key`. The alternative to `ansible-ssh-private-key`,
      not a supplement: setting both fails. Use this where Vault is already the source of
      truth, so rotating there keeps rotating here and the key is not copied into a second
      store that quietly goes stale.
    required: false
    default: ''

  ansible-ssh-known-hosts-vault:
    description: 'ansible: Vault reference to the known_hosts entries, `<path>#<field>`. The alternative to `ansible-ssh-known-hosts`.'
    required: false
    default: ''

  ansible-vault-password-vault:
    description: 'ansible: Vault reference to the ansible-vault password, `<path>#<field>`. The alternative to `ansible-vault-password`.'
    required: false
    default: ''

  ansible-verify-idempotence:
    description: |
      ansible: after a successful real run, run the playbook again in check mode and fail if
      any task would still change. A zero exit only proves the playbook ran; this is what
      proves it converged. Skipped automatically when the run itself was check mode.
    required: false
    default: 'true'

  # ── target: cloudflare-workers ───────────────────────────────────────────
  cloudflare-api-token:
    description: |
      cloudflare-workers, cloudflare-docs: API token Wrangler authenticates with. Pass a secret, never a
      literal. Mint it from Cloudflare's "Edit Cloudflare Workers" template rather than a
      hand-picked permission list, or the first deploy of a custom domain fails on a
      permission nobody thought to grant.
    required: false
    default: ''

  cloudflare-account-id:
    description: 'cloudflare-workers, cloudflare-docs: Cloudflare account id. Pass a secret.'
    required: false
    default: ''

  cloudflare-config:
    description: |
      cloudflare-workers, cloudflare-docs: path to the Wrangler config (wrangler.toml or wrangler.jsonc),
      passed as `--config`. Empty lets Wrangler find it, which is the normal case. The
      config owns the asset directory, routes, custom domains and 404 handling; the inputs
      here are overrides for the few things a workflow legitimately varies.
    required: false
    default: ''

  cloudflare-worker-name:
    description: 'cloudflare-workers, cloudflare-docs: overrides the `name` in the Wrangler config, passed as `--name`.'
    required: false
    default: ''

  cloudflare-env:
    description: |
      cloudflare-workers: Wrangler environment, passed as `--env`. This selects a config
      block, which is not the same thing as the shared `environment` input: that one is a
      label for notifications and the deployment record.
    required: false
    default: ''

  cloudflare-main:
    description: |
      cloudflare-workers: entry point for a Worker that runs code, passed as Wrangler's
      positional path argument. Leave empty for an assets-only Worker, which is the shape
      that serves static files straight from the edge with no cold start and no code in the
      request path.
    required: false
    default: ''

  cloudflare-build-command:
    description: 'cloudflare-workers: command run in working-directory before Wrangler, for a Worker that needs bundling. Empty skips it.'
    required: false
    default: ''

  cloudflare-compatibility-date:
    description: 'cloudflare-workers: overrides the config, passed as `--compatibility-date`.'
    required: false
    default: ''

  cloudflare-minify:
    description: 'cloudflare-workers: pass `--minify`. Applies to Worker code, not to static assets.'
    required: false
    default: 'false'

  cloudflare-vars:
    description: |
      cloudflare-workers: plain (NOT secret) variables, one `KEY=VALUE` per line, each passed
      as `--var`. Wrangler deletes vars not present in the config unless `--keep-vars` is set,
      so anything set in the dashboard belongs in the config instead.
    required: false
    default: ''

  cloudflare-wrangler-version:
    description: 'cloudflare-workers, cloudflare-docs: exact Wrangler version to run. Pinned, because the tool that publishes to production is not a floating dependency.'
    required: false
    default: '4.114.0'

  cloudflare-node-version:
    description: |
      cloudflare-workers, cloudflare-docs: Node version Wrangler runs on. Wrangler 4 declares
      `engines.node >= 22`, and on 20 it installs cleanly and then refuses to run, so this
      does not default to whatever the runner happens to ship.
    required: false
    default: '24'

  # ── target: cloudflare-docs ──────────────────────────────────────────────────
  cloudflare-docs-host:
    description: |
      cloudflare-docs: hostname the docs router serves, e.g. `docs.magmamoose.com`. The site
      Worker itself has no hostname — it is reachable only through the router's service
      binding — so this is the address the Access check and the reported URL are about.
      Required when `cloudflare-docs-require-access` is on.
    required: false
    default: ''

  cloudflare-docs-path:
    description: |
      cloudflare-docs: path segment this repository's site is served under on
      `cloudflare-docs-host`. Empty (default) uses the repository name, which is what the
      router dispatches on, so overriding it is for a repo whose site is mounted elsewhere.
    required: false
    default: ''

  cloudflare-docs-require-access:
    description: |
      cloudflare-docs: refuse to publish unless a Cloudflare Access application actually
      covers `<cloudflare-docs-host>/<cloudflare-docs-path>`. This is enforcement, not
      convention: "the site is behind Access" is otherwise a belief nothing checks, and the
      deploy is the one moment something can ask Cloudflare and refuse. Needs the
      `Access: Apps` READ permission on `cloudflare-api-token` — the "Edit Cloudflare
      Workers" template does not include it, and a 403 is treated as "could not tell", never
      as "nothing covers it".
    required: false
    default: 'false'

  cloudflare-docs-index:
    description: |
      cloudflare-docs: emit the docs corpus from the build: `llms.txt` and `llms-full.txt`
      written into the site before it is published, and a search index of every page for
      the documentation MCP servers. One pass over the markdown that was just rendered; no
      credentials and no network. Publishing the index is a separate opt-in,
      `cloudflare-docs-index-bucket`.
    required: false
    default: 'true'

  cloudflare-docs-index-bucket:
    description: |
      cloudflare-docs: R2 bucket the index is published to, as `index/<repo>.json`. Empty
      (default) writes llms.txt into the site and uploads no index. Only a deploy writes it,
      and only after the site itself deployed: a pull request would otherwise overwrite the
      shared corpus with an unmerged branch. Needs R2 object write on `cloudflare-api-token`,
      which the "Edit Cloudflare Workers" template does not include.
    required: false
    default: ''

  cloudflare-docs-capability-file:
    description: |
      cloudflare-docs: this repository's capability declaration, published to
      `capability/<repo>.json` in `cloudflare-docs-index-bucket`. Empty disables it; the
      default names a file most repositories do not have, and absent is the normal case —
      most repositories are not house tools. Present, it is validated against
      https://mcp.magmamoose.com/schema/capability.schema.json on every run, including a
      pull request, and a declaration that does not satisfy it FAILS THE RUN: the MCP reads
      a malformed document as private and reports it as unreadable, counted and never
      named, which is the one state invisible from the publishing side. `private` is
      republished from the repository's own visibility on the same fail-closed rule as the
      docs index, and `commit` and `generated` are stamped from the run.
    required: false
    default: 'capability.json'

  cloudflare-extra-args:
    description: 'cloudflare-workers: extra flags appended to the Wrangler invocation, split on whitespace.'
    required: false
    default: ''

  cloudflare-verify-config:
    description: |
      cloudflare-workers: before publishing, run `wrangler deploy --dry-run` and refuse to
      publish if Wrangler reports configuration it will not apply: an unexpected field (a
      misspelled `[[r2_bucket]]` is only a warning, and the Worker deploys with no bucket), or
      a top-level binding an `--env` deploy does not inherit. A binding is only real if
      Wrangler prints it. Costs one extra bundle per run.
    required: false
    default: 'true'

  # ── target: azure-functions-zip ──────────────────────────────────────────
  functions-app-name:
    description: 'azure-functions-zip: the Function App to publish to. Required for this target.'
    required: false
    default: ''

  functions-resource-group:
    description: 'azure-functions-zip: resource group the Function App lives in. Required for this target.'
    required: false
    default: ''

  functions-slot:
    description: |
      azure-functions-zip: deployment slot to publish to instead of production. Empty
      (default) publishes to the app itself.

      This is also what a preview has to use. A pull request must not publish onto the
      routes production serves, and a slot is Azure's only destination that does not —
      but a Linux Consumption plan HAS NO SLOTS. So on Consumption a preview is refused
      and says why, rather than quietly shipping a branch to production. On Premium or
      Dedicated, set this and previews go to the slot.
    required: false
    default: ''

  functions-ready-attempts:
    description: |
      azure-functions-zip: how many times to ask the app for an answer after publishing,
      before calling the deploy dead. Any HTTP status passes, including a 404 at the root,
      which is what a Function App whose only trigger is at `/api/<name>` normally returns.
      Only a connection failure and a 503 count as "not yet".

      The default is generous on purpose: a freshly created Consumption app 503s from both
      the site and its SCM endpoint until content is first published, so a FIRST deploy has
      to retry through that rather than fail on it.
    required: false
    default: '30'

  functions-ready-delay:
    description: 'azure-functions-zip: seconds between readiness attempts. With the default attempts, that is a five-minute ceiling on a cold first publish.'
    required: false
    default: '10'

  # ── target: azure-apim-policy ────────────────────────────────────────────
  apim-service-name:
    description: 'azure-apim-policy: the API Management instance to publish to. Required for this target.'
    required: false
    default: ''

  apim-resource-group:
    description: 'azure-apim-policy: resource group the instance lives in. Required for this target.'
    required: false
    default: ''

  apim-api-id:
    description: |
      azure-apim-policy: the API the documents are published to, by its id (the name in its
      resource id, not its display name). Required for this target.

      The API and its operations must already exist. This target publishes behaviour into them,
      the way azure-functions-zip publishes code into an existing Function App, and a document
      named after an operation the API does not have is refused before anything is published.
    required: false
    default: ''

  apim-policy-format:
    description: |
      azure-apim-policy: how the documents are written. `rawxml` (default) is what the portal's
      editor shows: policy expressions unescaped, `@(context.Request.Headers.GetValueOrDefault("x", ""))`
      as it reads. `xml` is strict XML, with every quote and angle bracket inside an expression
      entity-escaped. Mixing them up fails at publish, when API Management compiles the
      expressions.
    required: false
    default: 'rawxml'

  # ── Verification ─────────────────────────────────────────────────────────
  verify-url:
    description: 'Post-deploy: the URL that must answer. Empty skips verification. Catches the deploy that uploaded but did not bind, the one failure that otherwise looks green.'
    required: false
    default: ''

  verify-header:
    description: 'Post-deploy: a response header that must be present on `verify-url` (e.g. content-security-policy).'
    required: false
    default: ''

  verify-header-match:
    description: 'Post-deploy: an extended regex the `verify-header` value must match.'
    required: false
    default: ''

  verify-method:
    description: |
      Post-deploy: HTTP method used to request `verify-url`. `GET` by default.

      Set it where a GET cannot verify the endpoint at all. A webhook receiver binds POST and
      nothing else, so a GET reaches no function and the platform answers 404 — which is also
      what an empty package returns, leaving the check unable to tell a working deploy from a
      broken one. `verify-method: POST` with `verify-status: 401` asserts that the function is
      bound and that its signature check refuses an unsigned request, which is the thing worth
      knowing.

      The method survives a redirect: curl otherwise downgrades a redirected POST to a GET,
      which would quietly turn the assertion into a different one.
    required: false
    default: 'GET'

  verify-status:
    description: 'Post-deploy: expected HTTP status from `verify-url`.'
    required: false
    default: '200'

  verify-attempts:
    description: 'Post-deploy: how many times to try `verify-url` before failing.'
    required: false
    default: '6'

  verify-delay:
    description: 'Post-deploy: seconds between verification attempts.'
    required: false
    default: '10'

  # ── Notifications ────────────────────────────────────────────────────────
  notify:
    description: '`always` (default), `on-success`, or `on-failure`. Applies to the webhook sinks.'
    required: false
    default: 'always'

  pr-comment:
    description: 'Sticky pull-request comment. `auto` (default) means on for preview mode and for the terragrunt target.'
    required: false
    default: 'auto'

  slack-webhook:
    description: 'Slack incoming-webhook URL. Empty means the sink is off. Never fails the deploy.'
    required: false
    default: ''

  teams-webhook:
    description: 'Microsoft Teams incoming-webhook URL. Empty means the sink is off. Never fails the deploy.'
    required: false
    default: ''

  api-url:
    description: 'Base URL of a Tremvok API to record this deployment with. Authenticates with a GitHub OIDC token, so the repository stores no credential. Empty means no record is kept.'
    required: false
    default: ''

  api-audience:
    description: 'OIDC audience the Tremvok API expects.'
    required: false
    default: 'tremvok'

  auth-token:
    description: 'Token used for the pull-request comment and the check run. Needs `pull-requests: write` and, for the terragrunt target, `checks: write`.'
    required: false
    default: ${{ github.token }}

  # ── Escape hatches ───────────────────────────────────────────────────────
  allow-fork-preview:
    description: 'Let a fork pull request attempt a deploy. Off by default and almost always wrong: a fork cannot read secrets, so this only converts an honest skip into an auth error.'
    required: false
    default: 'false'

  allow-dispatch-from-any-ref:
    description: 'Let a manual run deploy from a branch other than the default one. Off by default, publishing a topic branch to production usually is not what "Run workflow" meant.'
    required: false
    default: 'false'

outputs:
  target:
    description: 'The deployment target this run used.'
    value: ${{ inputs.target }}
  mode:
    description: 'The resolved mode: deploy, preview or rollback.'
    value: ${{ steps.resolve.outputs.mode }}
  environment:
    description: 'The resolved environment name.'
    value: ${{ steps.resolve.outputs.environment }}
  url:
    description: 'URL of what was deployed, when the target produces one.'
    value: ${{ steps.deploy-s3.outputs.url || steps.deploy-cloudflare.outputs.url || steps.deploy-azure-functions.outputs.url || steps.deploy-azure-apim.outputs.url }}
  deployed:
    description: 'true when something was actually deployed (false for a skip).'
    value: ${{ steps.outcome.outputs.deployed }}
  verified:
    description: 'true when post-deploy verification ran and passed.'
    value: ${{ steps.verify.outputs.verified }}
  skipped:
    description: 'true when the run skipped (fork pull request, or no credential).'
    value: ${{ steps.preflight.outputs.skip }}
  skip-reason:
    description: 'Why it skipped, in a sentence.'
    value: ${{ steps.preflight.outputs.skip-reason }}
  record-id:
    description: 'Identifier returned by the Tremvok API, when api-url is set.'
    value: ${{ steps.record.outputs.record-id }}
  site-dir:
    description: 'github-pages: absolute path to the built site.'
    value: ${{ steps.pages-build.outputs.site-dir }}
  pages-toolchain:
    description: 'github-pages: the toolchain actually used, uv or pip.'
    value: ${{ steps.pages-detect.outputs.toolchain }}
  version-id:
    description: 'lambda-zip, cloudflare-workers, azure-functions-zip, azure-apim-policy: the published version. A Lambda version number, a Worker Version ID, the package sha256, or the sha256 of the policy set — Azure exposes no per-deploy content hash of its own.'
    value: ${{ steps.deploy-lambda.outputs.version-id || steps.deploy-cloudflare.outputs.version-id || steps.deploy-azure-functions.outputs.version-id || steps.deploy-azure-apim.outputs.version-id }}
  stacks:
    description: 'terragrunt: how many stacks this run discovered.'
    value: ${{ steps.deploy-terragrunt.outputs.stacks }}
  plan-changes:
    description: 'terragrunt: how many of those stacks planned with a diff.'
    value: ${{ steps.deploy-terragrunt.outputs.plan-changes }}
  applied:
    description: 'terragrunt: true when this run applied, false when it only planned.'
    value: ${{ steps.deploy-terragrunt.outputs.applied }}
  changed-tasks:
    description: 'ansible: how many tasks reported changed on the real run.'
    value: ${{ steps.deploy-ansible.outputs.changed-tasks }}
  idempotent:
    description: 'ansible: true when the second check-mode run found nothing left to change.'
    value: ${{ steps.deploy-ansible.outputs.idempotent }}

runs:
  using: 'composite'
  steps:
    # First, before a checkout and before anything is installed. An input that does not
    # apply to the selected target is a mistake, and the cheapest place to say so is
    # before the run has spent two minutes proving it.
    - name: Validate the inputs against the target
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        INPUTS_JSON: ${{ toJSON(inputs) }}
        # Checked here, before the fetch-depth-0 checkout, the pinned tool download and
        # assume-role, so a typo costs nothing and leaves no role session in the audit log.
        TG_PULL_REQUEST: ${{ inputs.terragrunt-pull-request }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/validate-inputs.sh"

    - name: Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Terragrunt maps changed files to stacks, and a push event's "before" commit is
        # unreachable in a shallow clone, which reports zero changed files and discovers
        # zero stacks, silently.
        fetch-depth: ${{ inputs.target == 'terragrunt' && 0 || 1 }}

    - name: Resolve the mode from the event
      id: resolve
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        # `|| 'main'` because the repository object is absent from a few event payloads, and
        # an empty default branch would make every push look like a topic-branch push.
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        ENVIRONMENT: ${{ inputs.environment }}
        ALLOW_DISPATCH_FROM_ANY_REF: ${{ inputs.allow-dispatch-from-any-ref }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/resolve-mode.sh"

    - name: Preflight, can this run deploy at all?
      id: preflight
      shell: bash
      env:
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        ROLE_TO_ASSUME: ${{ inputs.aws-role-to-assume }}
        AZURE_CLIENT_ID: ${{ inputs.azure-client-id }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
        TARGET: ${{ inputs.target }}
        ALLOW_FORK_PREVIEW: ${{ inputs.allow-fork-preview }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/preflight.sh"

    # Before either build, because both fetch their dependencies before they run. The
    # rewrites go into this job's environment and nowhere else: `git config --global` would
    # leave the token in ~/.gitconfig on a runner that may be self-hosted and shared.
    - name: Authenticate the build against private git hosts
      if: steps.preflight.outputs.skip != 'true' && inputs.build-git-credentials != ''
      shell: bash
      env:
        BUILD_GIT_CREDENTIALS: ${{ inputs.build-git-credentials }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/build-git-credentials.sh"

    # ── target: github-pages ─────────────────────────────────────────────────────────
    # Detection rather than declaration: uv.lock in the tree is the fact, and a caller
    # restating it in config is one more thing that can disagree with the repo.
    - name: Detect the docs toolchain
      id: pages-detect
      if: steps.preflight.outputs.skip != 'true' && (inputs.target == 'github-pages' || inputs.target == 'cloudflare-docs')
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUESTED: ${{ inputs.pages-toolchain }}
        REQUIREMENTS: ${{ inputs.pages-requirements }}
        MODE: ${{ steps.resolve.outputs.mode }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/pages-detect.sh"

    - name: Set up uv
      if: steps.pages-detect.outputs.toolchain == 'uv'
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: ${{ inputs.pages-python-version }}

    - name: Set up Python
      if: steps.pages-detect.outputs.toolchain == 'pip'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.pages-python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.pages-requirements }}

    # Installed as its own step so the lint below can import PyYAML, which arrives
    # transitively with MkDocs. Hand-rolling a YAML parser to avoid this would be a
    # worse trade than one extra step.
    - name: Install the docs toolchain
      if: (inputs.target == 'github-pages' || inputs.target == 'cloudflare-docs') && steps.pages-detect.outputs.toolchain != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: ${{ steps.pages-detect.outputs.toolchain }}
        DOCS_GROUP: ${{ inputs.pages-dependency-group }}
        REQUIREMENTS: ${{ inputs.pages-requirements }}
      run: |
        set -euo pipefail
        if [ "$TOOLCHAIN" = "uv" ]; then
          uv sync --group "$DOCS_GROUP"
        else
          pip install --disable-pip-version-check --quiet -r "$REQUIREMENTS"
        fi

    - name: Lint repo shape
      if: (inputs.target == 'github-pages' || inputs.target == 'cloudflare-docs') && inputs.pages-lint == 'true' && steps.pages-detect.outputs.toolchain != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: ${{ steps.pages-detect.outputs.toolchain }}
        SCRIPT: ${{ github.action_path }}/scripts/lint_docs.py
        PROFILE: ${{ inputs.pages-profile }}
        BUDGET: ${{ inputs.pages-readme-budget }}
      run: |
        set -euo pipefail
        args=(--root . --profile "$PROFILE" --readme-budget "$BUDGET" --github-annotations)
        if [ "$TOOLCHAIN" = "uv" ]; then
          uv run --no-sync python "$SCRIPT" "${args[@]}"
        else
          python "$SCRIPT" "${args[@]}"
        fi

    # Only when the runner has no Node. A GitHub-hosted runner already does, so this
    # step is skipped there and costs nothing.
    - name: Set up Node for markdownlint
      if: (inputs.target == 'github-pages' || inputs.target == 'cloudflare-docs') && inputs.pages-markdownlint == 'true' && steps.pages-detect.outputs.has-node == 'false'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    - name: Lint markdown
      if: (inputs.target == 'github-pages' || inputs.target == 'cloudflare-docs') && inputs.pages-markdownlint == 'true' && steps.pages-detect.outputs.toolchain != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DOCS_DIR: docs
      run: |
        set -euo pipefail
        cfg=""
        for c in .markdownlint.jsonc .markdownlint.json .markdownlint.yaml .markdownlint.yml; do
          [ -f "$c" ] && { cfg="$c"; break; }
        done
        if [ -z "$cfg" ]; then
          echo "No markdownlint config found; skipping."
          exit 0
        fi
        npx --yes markdownlint-cli2 --config "$cfg" "$DOCS_DIR/**/*.md" "README.md"

    - name: Build the site
      id: pages-build
      if: (inputs.target == 'github-pages' || inputs.target == 'cloudflare-docs') && steps.pages-detect.outputs.toolchain != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: ${{ steps.pages-detect.outputs.toolchain }}
        SITE_DIR: ${{ inputs.pages-site-dir }}
        STRICT: ${{ inputs.pages-strict }}
      run: |
        set -euo pipefail
        strict_flag=""
        [ "$STRICT" = "true" ] && strict_flag="--strict"
        if [ "$TOOLCHAIN" = "uv" ]; then
          uv run --no-sync mkdocs build $strict_flag --site-dir "$SITE_DIR"
        else
          mkdocs build $strict_flag --site-dir "$SITE_DIR"
        fi
        echo "site-dir=$(cd "$SITE_DIR" && pwd)" >> "$GITHUB_OUTPUT"

    # ── both docs targets: page metadata ─────────────────────────────────────
    #
    # Per-page descriptions, Open Graph and Twitter tags, JSON-LD and markdown twins, written
    # into the HTML the build just produced. See scripts/gen_docs_seo.py for what each is for.
    #
    # A step and not a MkDocs plugin or hook, for the reason the corpus step below gives: a
    # plugin has to be named in `plugins:` (a hook in `hooks:`), and a repo that declares
    # either list in its own mkdocs.yml silently discards the shared mkdocs.base.yml's.
    #
    # WHERE IT SITS IS THE CONTRACT. After the build, because it edits the build's output.
    # Before the Pages artifact is staged and before the Workers deploy, or the site goes out
    # without any of it. Before the corpus step, because llms.txt links each page's markdown
    # twin only when it finds one on disk. None of those orderings fails if broken; the site
    # just quietly loses the metadata, so tests/test_gen_docs_seo.py pins them.
    #
    # `--site-url` is the address the router serves the site at, the one the corpus cites. It
    # stands in only when mkdocs.yml resolves no `site_url`, and a disagreement between the
    # two is reported rather than silently resolved.
    - name: Give each page its own search, social and agent metadata
      if: (inputs.target == 'github-pages' || inputs.target == 'cloudflare-docs') && inputs.pages-seo == 'true' && steps.pages-detect.outputs.toolchain != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: ${{ steps.pages-detect.outputs.toolchain }}
        SCRIPT: ${{ github.action_path }}/scripts/gen_docs_seo.py
        SITE_DIR: ${{ inputs.pages-site-dir }}
        DOCS_HOST: ${{ inputs.cloudflare-docs-host }}
        DOCS_PATH: ${{ inputs.cloudflare-docs-path || github.event.repository.name }}
      run: |
        set -euo pipefail
        args=(--root . --site-dir "$SITE_DIR")
        if [ -n "$DOCS_HOST" ]; then
          args+=(--site-url "https://${DOCS_HOST}/${DOCS_PATH}/")
        fi
        if [ "$TOOLCHAIN" = "uv" ]; then
          uv run --no-sync python "$SCRIPT" "${args[@]}"
        else
          python "$SCRIPT" "${args[@]}"
        fi

    # ── cloudflare-docs only: the corpus ─────────────────────────────────────
    #
    # Before the deploy, not after: llms.txt and llms-full.txt are written INTO the built site,
    # so they have to exist by the time it is uploaded. After the page metadata, because llms.txt
    # links each page's markdown twin only when it finds one on disk.
    #
    # A step rather than a MkDocs plugin. A plugin has to be named in `plugins:`, and a repo
    # that declares `plugins:` in its own mkdocs.yml silently discards every entry in the
    # shared mkdocs.base.yml, because MkDocs REPLACES lists rather than merging them.
    # `pages-lint` fails the build on exactly that, so the corpus must not be what forces
    # every repo to trip it.
    #
    # When `cloudflare-docs-host` is set, citations are built from the address the router
    # actually serves this site at rather than from `site_url` in mkdocs.yml. A stale
    # `site_url` would otherwise put a wrong link into every answer an agent gives.
    - name: Emit the docs corpus
      id: docs-index
      if: inputs.target == 'cloudflare-docs' && inputs.cloudflare-docs-index == 'true' && steps.pages-detect.outputs.toolchain != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: ${{ steps.pages-detect.outputs.toolchain }}
        SCRIPT: ${{ github.action_path }}/scripts/gen_docs_index.py
        SITE_DIR: ${{ inputs.pages-site-dir }}
        REPO_NAME: ${{ github.event.repository.name }}
        DOCS_HOST: ${{ inputs.cloudflare-docs-host }}
        DOCS_PATH: ${{ inputs.cloudflare-docs-path || github.event.repository.name }}
        INDEX_DIR: ${{ runner.temp }}/tremvok-docs-index
        COMMIT: ${{ github.sha }}
        # Decides whether a public docs surface may show this repository at all. Taken from
        # GitHub rather than an input, so it cannot drift from the truth, and read as private
        # unless it is exactly `public`: `internal`, or an event that carries no repository
        # object, must never mark an index public.
        VISIBILITY: ${{ github.event.repository.visibility }}
      run: |
        set -euo pipefail
        args=(--root . --site-dir "$SITE_DIR" --repo "$REPO_NAME" \
              --index-out "$INDEX_DIR" --commit "$COMMIT" --visibility "$VISIBILITY")
        if [ -n "$DOCS_HOST" ]; then
          args+=(--site-url "https://${DOCS_HOST}/${DOCS_PATH}/")
        fi
        if [ "$TOOLCHAIN" = "uv" ]; then
          uv run --no-sync python "$SCRIPT" "${args[@]}"
        else
          python "$SCRIPT" "${args[@]}"
        fi
        echo "index-file=${INDEX_DIR}/index/${REPO_NAME}.json" >> "$GITHUB_OUTPUT"


    # ── both docs targets: agent readiness ───────────────────────────────────
    #
    # An Agent Skills index with a skill describing the site, WebMCP tools on every page, and an
    # auth.md for a site served at the root of its host, all written into the built site. See
    # scripts/gen_docs_agents.py for what each is for, and for what a build cannot do.
    #
    # WHERE IT SITS IS THE CONTRACT, as it is for the page metadata. After the metadata and the
    # corpus, because the skill mentions markdown twins, llms.txt and llms-full.txt only when it
    # finds them on disk, and run before them it would describe a site with none of the three.
    # Before the Pages artifact is staged and before the Workers deploy, or the site goes out
    # without any of it. None of that fails if broken, so tests/test_gen_docs_agents.py pins it.
    #
    # `--site-url` is the address the router serves the site at, and here it wins over
    # `site_url`, as it does for the corpus: the skill's URL in the index is a file a client
    # fetches, so it has to be where the file actually is.
    - name: Make the site agent-ready
      if: (inputs.target == 'github-pages' || inputs.target == 'cloudflare-docs') && inputs.pages-agent-ready == 'true' && steps.pages-detect.outputs.toolchain != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: ${{ steps.pages-detect.outputs.toolchain }}
        SCRIPT: ${{ github.action_path }}/scripts/gen_docs_agents.py
        SITE_DIR: ${{ inputs.pages-site-dir }}
        DOCS_HOST: ${{ inputs.cloudflare-docs-host }}
        DOCS_PATH: ${{ inputs.cloudflare-docs-path || github.event.repository.name }}
        # A site behind Access is read by nobody who has not signed in, so it gets no auth.md
        # saying it needs no credentials. The script reads the value the way the Access check
        # does. On github-pages it is always false, and a gated Pages site sets
        # extra.agents.auth_md: false instead.
        REQUIRE_ACCESS: ${{ inputs.cloudflare-docs-require-access }}
      run: |
        set -euo pipefail
        args=(--root . --site-dir "$SITE_DIR" --access-required "$REQUIRE_ACCESS")
        if [ -n "$DOCS_HOST" ]; then
          args+=(--site-url "https://${DOCS_HOST}/${DOCS_PATH}/")
        fi
        if [ "$TOOLCHAIN" = "uv" ]; then
          uv run --no-sync python "$SCRIPT" "${args[@]}"
        else
          python "$SCRIPT" "${args[@]}"
        fi

    # ── target: github-pages ─────────────────────────────────────────────────
    - name: Configure Pages
      if: inputs.target == 'github-pages' && steps.pages-detect.outputs.stage-pages == 'true'
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    # HIDDEN FILES GO IN WHEN THE AGENT STEP RAN. upload-pages-artifact leaves out every path
    # that starts with a dot unless told otherwise, and the Agent Skills index lives under
    # `.well-known/`: the step writes it, the artifact drops it, and the published site has no
    # skills, with nothing anywhere saying so. Tied to the input, so turning the step off stages
    # exactly what it staged before. `.git` and `.github` are left out either way.
    - name: Stage the Pages artifact
      if: inputs.target == 'github-pages' && steps.pages-detect.outputs.stage-pages == 'true'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ inputs.working-directory }}/${{ inputs.pages-site-dir }}
        include-hidden-files: ${{ inputs.pages-agent-ready }}

    # ── target: cloudflare-docs ──────────────────────────────────────────────
    #
    # The build above is shared with github-pages; only the publish differs. What is published
    # is a Worker with static assets and no route of its own: the docs router on
    # `cloudflare-docs-host` reaches it over a service binding. See workers/docs-router/.
    - name: Set up Node for Wrangler
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'cloudflare-docs'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.cloudflare-node-version }}

    # Before the publish, not after. A site that went out uncovered is already public, and
    # "we noticed afterwards" is what this check exists to prevent.
    #
    # AND ONLY WHEN THERE IS A PUBLISH. `mode` is what decides that, so it belongs in this
    # condition beside the target: a pull request resolves to `preview`, and these Workers
    # have no preview destination at all — `deploy-cloudflare-docs.sh` and
    # `publish-docs-index.sh` both return early on any mode but `deploy`. Gating on the
    # target alone made this the one docs step that ran when nothing was going to be
    # published, which turns every documentation pull request in a repo with
    # `cloudflare-docs-require-access` permanently red for a deploy it was never going to
    # do. A required check that is always failing is a check people learn to merge past,
    # which costs more than the early warning is worth.
    #
    # `github-pages` never had this problem and the difference is worth naming, because it
    # is not that v1 was more careful: its caller passed `target: none` on a pull request,
    # so every target-gated step fell away with it. `mode` replaced that, and this step did
    # not get the memo.
    - name: Is the docs site actually behind Access?
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'cloudflare-docs' && steps.resolve.outputs.mode == 'deploy'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUIRE_ACCESS: ${{ inputs.cloudflare-docs-require-access }}
        ACCESS_HOST: ${{ inputs.cloudflare-docs-host }}
        ACCESS_PATH: ${{ inputs.cloudflare-docs-path || github.event.repository.name }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/access-covers.sh"

    - name: Deploy — Cloudflare docs
      id: deploy-cloudflare-docs
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'cloudflare-docs'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MODE: ${{ steps.resolve.outputs.mode }}
        DRY_RUN: ${{ inputs.dry-run }}
        SITE_DIR: ${{ inputs.pages-site-dir }}
        CONFIG: ${{ inputs.cloudflare-config }}
        WORKER_NAME: ${{ inputs.cloudflare-worker-name }}
        CF_ENV: ${{ inputs.cloudflare-env }}
        DOCS_HOST: ${{ inputs.cloudflare-docs-host }}
        DOCS_PATH: ${{ inputs.cloudflare-docs-path || github.event.repository.name }}
        WRANGLER_VERSION: ${{ inputs.cloudflare-wrangler-version }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/deploy-cloudflare-docs.sh"

    # After the site deployed, never before. The index is what every agent-facing surface
    # reads, so it has to describe a site that exists: published ahead of a deploy that then
    # failed, agents would cite pages the router does not serve.
    - name: Publish the docs corpus
      if: inputs.target == 'cloudflare-docs' && inputs.cloudflare-docs-index-bucket != '' && steps.docs-index.outputs.index-file != '' && steps.deploy-cloudflare-docs.outcome == 'success'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INDEX_FILE: ${{ steps.docs-index.outputs.index-file }}
        BUCKET: ${{ inputs.cloudflare-docs-index-bucket }}
        REPO: ${{ github.event.repository.name }}
        MODE: ${{ steps.resolve.outputs.mode }}
        DRY_RUN: ${{ inputs.dry-run }}
        WRANGLER_VERSION: ${{ inputs.cloudflare-wrangler-version }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/publish-docs-index.sh"

    # Validated on every run, uploaded only by a deploy. A declaration checked only on `main`
    # is checked after the merge that broke it, so the pull request is green and the deploy
    # that finds out is somebody else's; but there is one key per repository, so a preview
    # that wrote would overwrite the shared registry with an unmerged branch. Ordered after
    # the site for the same reason as the corpus: a capability cites documentation pages.
    - name: Publish the capability declaration
      if: inputs.target == 'cloudflare-docs' && inputs.cloudflare-docs-capability-file != '' && inputs.cloudflare-docs-index-bucket != '' && steps.deploy-cloudflare-docs.outcome == 'success'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CAPABILITY_FILE: ${{ inputs.cloudflare-docs-capability-file }}
        BUCKET: ${{ inputs.cloudflare-docs-index-bucket }}
        REPO: ${{ github.event.repository.name }}
        COMMIT: ${{ github.sha }}
        # Same source and same fail-closed rule as the docs index: only an explicit `public`
        # publishes a public declaration, so `internal`, an empty value and an event carrying
        # no repository object are all private. Two visibility rules over one bucket is one
        # rule that eventually disagrees with the other, and it disagrees in the leaking
        # direction.
        VISIBILITY: ${{ github.event.repository.visibility }}
        MODE: ${{ steps.resolve.outputs.mode }}
        DRY_RUN: ${{ inputs.dry-run }}
        WRANGLER_VERSION: ${{ inputs.cloudflare-wrangler-version }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/publish-capability.sh"

    # ── targets: s3-cloudfront, lambda-zip, terragrunt ───────────────────────
    - name: Assume the deployment role
      if: steps.preflight.outputs.skip != 'true' && inputs.aws-role-to-assume != ''
      shell: bash
      env:
        ROLE_TO_ASSUME: ${{ inputs.aws-role-to-assume }}
        AWS_REGION: ${{ inputs.aws-region }}
        ROLE_DURATION_SECONDS: ${{ inputs.aws-role-duration-seconds }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/assume-role.sh"

    # ── targets: terragrunt, azure-functions-zip, azure-apim-policy ─────────
    # The Azure counterpart of the assume-role step, gated on the input rather than on a
    # target for the same reason that one is: the question "has the caller asked for a
    # session?" is the same question whichever target consumes it.
    #
    # A script rather than `azure/login`, for the reason this repository does not use
    # `aws-actions/configure-aws-credentials` either: a third-party action inside the step
    # that holds production credentials, for an exchange that is one `az login` call. A
    # caller who prefers it runs it earlier and leaves azure-client-id empty.
    #
    # ON TERRAGRUNT THIS IS THE PROVIDER'S CREDENTIAL, WHICH IS NOT THE STATE BACKEND'S.
    # `terragrunt-stack-env` carries the backend one (an ARM_ACCESS_KEY per stack), so a run
    # without this step reads and writes state perfectly well and then dies at
    # `provider "azurerm"`, whose default chain falls through to the Azure CLI. That failure
    # reads as a broken runner rather than as a missing credential, which is why
    # terragrunt-credentials.sh below says so in one line before the first plan.
    - name: Sign in to Azure
      if: steps.preflight.outputs.skip != 'true' && inputs.azure-client-id != ''
      shell: bash
      env:
        AZURE_CLIENT_ID: ${{ inputs.azure-client-id }}
        AZURE_TENANT_ID: ${{ inputs.azure-tenant-id }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/azure-login.sh"

    # ── target: terragrunt ───────────────────────────────────────────────────
    # The third of the set, gated on its input like the other two. Nothing else here publishes
    # to Google, so this is terragrunt's alone until something does.
    - name: Federate with Google Cloud
      if: steps.preflight.outputs.skip != 'true' && inputs.gcp-workload-identity-provider != ''
      shell: bash
      env:
        WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.gcp-workload-identity-provider }}
        GCP_SERVICE_ACCOUNT: ${{ inputs.gcp-service-account }}
        GCP_PROJECT_ID: ${{ inputs.gcp-project-id }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/gcp-login.sh"

    - name: Deploy, S3 + CloudFront
      id: deploy-s3
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 's3-cloudfront'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUCKET: ${{ inputs.s3-bucket }}
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
        KEY_PREFIX: ${{ inputs.s3-key-prefix }}
        MODE: ${{ steps.resolve.outputs.mode }}
        PREVIEW_ALIAS: ${{ steps.resolve.outputs.preview-alias }}
        DISTRIBUTION_ID: ${{ inputs.cloudfront-distribution-id }}
        SITE_URL: ${{ inputs.cloudfront-site-url }}
        DELETE_ORPHANS: ${{ inputs.s3-delete-orphans }}
        DRY_RUN: ${{ inputs.dry-run }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/deploy-s3-cloudfront.sh"

    - name: Deploy, Lambda package
      id: deploy-lambda
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'lambda-zip'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FUNCTION_NAME: ${{ inputs.lambda-function-name }}
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
        ARTIFACT_BUCKET: ${{ inputs.s3-bucket }}
        KEY_PREFIX: ${{ inputs.s3-key-prefix }}
        VERSION_LABEL: ${{ inputs.lambda-version-label }}
        ALIAS: ${{ inputs.lambda-function-alias }}
        MODE: ${{ steps.resolve.outputs.mode }}
        DRY_RUN: ${{ inputs.dry-run }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/deploy-lambda-zip.sh"

    # ── target: terragrunt ───────────────────────────────────────────────────
    # The tools rather than a third-party setup action, for the same reason the plan is
    # checksum-verified: this step decides what binary applies to production, and a
    # floating version is the one input nobody reviews.
    - name: Install pinned tofu and terragrunt
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'terragrunt' && inputs.terragrunt-install != 'never'
      shell: bash
      env:
        INSTALL: ${{ inputs.terragrunt-install }}
        TOFU_VERSION: ${{ inputs.terragrunt-tofu-version }}
        TG_VERSION: ${{ inputs.terragrunt-version }}
        PLUGIN_CACHE: ${{ inputs.terragrunt-plugin-cache }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/terragrunt-bootstrap.sh"

    # Terragrunt buffers plan output to a file, so an unreachable state backend or provider
    # API is a silent wait until terragrunt-timeout rather than an error. Probe first: a red
    # step in eight seconds instead of 900 seconds of nothing. After the tool install, whose
    # own download proves general egress works, so a 000 here means these endpoints and not a
    # runner with no network.
    - name: Preflight, are the terragrunt endpoints reachable?
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'terragrunt' && inputs.terragrunt-preflight-urls != ''
      shell: bash
      env:
        PREFLIGHT_URLS: ${{ inputs.terragrunt-preflight-urls }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/preflight-urls.sh"

    - name: Deploy, Terragrunt
      id: deploy-terragrunt
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'terragrunt'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ROOT_DIR: ${{ inputs.terragrunt-root }}
        EXCLUDE_SEGMENTS: ${{ inputs.terragrunt-exclude }}
        SCOPE: ${{ inputs.terragrunt-scope }}
        APPLY: ${{ inputs.terragrunt-apply }}
        APPLY_ON_MERGE: ${{ inputs.terragrunt-apply-on-merge }}
        APPLY_OPERATORS: ${{ inputs.terragrunt-apply-operators }}
        STACK_ENV: ${{ inputs.terragrunt-stack-env }}
        CHECK_NAME: ${{ inputs.terragrunt-check-name }}
        TG_REFRESH: ${{ inputs.terragrunt-refresh }}
        TG_CREDENTIAL_PREFLIGHT: ${{ inputs.terragrunt-credential-preflight }}
        TG_TIMEOUT: ${{ inputs.terragrunt-timeout }}
        TG_LOG_LEVEL: ${{ inputs.terragrunt-log-level }}
        EXTRA_ARGS: ${{ inputs.terragrunt-extra-args }}
        EVENT_NAME: ${{ github.event_name }}
        # The review's own state, so a run triggered by a COMMENTED review does not spend an
        # approval left on an earlier commit. Empty on every other event.
        REVIEW_STATE: ${{ github.event.review.state }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # The override, resolved in terragrunt-changed-files.sh rather than by a `||` here:
        # the choice between the event and the input is logic, and logic lives in a script.
        TG_PULL_REQUEST: ${{ inputs.terragrunt-pull-request }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        AUTH_TOKEN: ${{ inputs.auth-token }}
        DRY_RUN: ${{ inputs.dry-run }}
        AWS_REGION: ${{ inputs.aws-region }}
        EVENT_BEFORE: ${{ github.event.before }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/terragrunt-changed-files.sh"

    # ── target: ansible ──────────────────────────────────────────────────────
    - name: Set up Python for Ansible
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'ansible'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.ansible-python-version }}

    - name: Deploy, Ansible
      id: deploy-ansible
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'ansible'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANSIBLE_VERSION: ${{ inputs.ansible-version }}
        PLAYBOOK: ${{ inputs.ansible-playbook }}
        INVENTORY: ${{ inputs.ansible-inventory }}
        GALAXY_REQUIREMENTS: ${{ inputs.ansible-galaxy-requirements }}
        LIMIT: ${{ inputs.ansible-limit }}
        TAGS: ${{ inputs.ansible-tags }}
        SKIP_TAGS: ${{ inputs.ansible-skip-tags }}
        CHECK: ${{ inputs.ansible-check }}
        DIFF: ${{ inputs.ansible-diff }}
        EXTRA_VARS: ${{ inputs.ansible-extra-vars }}
        EXTRA_ARGS: ${{ inputs.ansible-extra-args }}
        SSH_PRIVATE_KEY: ${{ inputs.ansible-ssh-private-key }}
        SSH_USER: ${{ inputs.ansible-ssh-user }}
        SSH_KNOWN_HOSTS: ${{ inputs.ansible-ssh-known-hosts }}
        VAULT_PASSWORD: ${{ inputs.ansible-vault-password }}
        SSH_PRIVATE_KEY_VAULT: ${{ inputs.ansible-ssh-private-key-vault }}
        SSH_KNOWN_HOSTS_VAULT: ${{ inputs.ansible-ssh-known-hosts-vault }}
        VAULT_PASSWORD_VAULT: ${{ inputs.ansible-vault-password-vault }}
        VAULT_ADDR: ${{ inputs.vault-addr }}
        VAULT_TOKEN: ${{ inputs.vault-token }}
        VAULT_NAMESPACE: ${{ inputs.vault-namespace }}
        VAULT_PASSTHROUGH: ${{ inputs.ansible-vault-passthrough }}
        VERIFY_IDEMPOTENCE: ${{ inputs.ansible-verify-idempotence }}
        EVENT_NAME: ${{ github.event_name }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/deploy-ansible.sh"

    # ── target: cloudflare-workers ───────────────────────────────────────────
    # Wrangler 4 declares `engines.node >= 22`. On Node 20 it installs cleanly and then
    # refuses to run, and a self-hosted runner may ship no Node at all.
    - name: Set up Node for Wrangler
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'cloudflare-workers'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.cloudflare-node-version }}

    - name: Deploy — Cloudflare Workers
      id: deploy-cloudflare
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'cloudflare-workers'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        MODE: ${{ steps.resolve.outputs.mode }}
        PREVIEW_ALIAS: ${{ steps.resolve.outputs.preview-alias }}
        CONFIG: ${{ inputs.cloudflare-config }}
        WORKER_NAME: ${{ inputs.cloudflare-worker-name }}
        CF_ENV: ${{ inputs.cloudflare-env }}
        MAIN: ${{ inputs.cloudflare-main }}
        ASSETS: ${{ inputs.artifact-path }}
        BUILD_COMMAND: ${{ inputs.cloudflare-build-command }}
        COMPATIBILITY_DATE: ${{ inputs.cloudflare-compatibility-date }}
        MINIFY: ${{ inputs.cloudflare-minify }}
        VARS: ${{ inputs.cloudflare-vars }}
        EXTRA_ARGS: ${{ inputs.cloudflare-extra-args }}
        WRANGLER_VERSION: ${{ inputs.cloudflare-wrangler-version }}
        DRY_RUN: ${{ inputs.dry-run }}
        VERIFY_CONFIG: ${{ inputs.cloudflare-verify-config }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/deploy-cloudflare-workers.sh"

    - name: Deploy, Azure Functions package
      id: deploy-azure-functions
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'azure-functions-zip'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APP_NAME: ${{ inputs.functions-app-name }}
        RESOURCE_GROUP: ${{ inputs.functions-resource-group }}
        SLOT: ${{ inputs.functions-slot }}
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
        READY_ATTEMPTS: ${{ inputs.functions-ready-attempts }}
        READY_DELAY: ${{ inputs.functions-ready-delay }}
        MODE: ${{ steps.resolve.outputs.mode }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/deploy-azure-functions-zip.sh"

    - name: Deploy, API Management policies
      id: deploy-azure-apim
      if: steps.preflight.outputs.skip != 'true' && inputs.target == 'azure-apim-policy'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SERVICE_NAME: ${{ inputs.apim-service-name }}
        RESOURCE_GROUP: ${{ inputs.apim-resource-group }}
        API_ID: ${{ inputs.apim-api-id }}
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
        POLICY_FORMAT: ${{ inputs.apim-policy-format }}
        MODE: ${{ steps.resolve.outputs.mode }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/deploy-azure-apim-policy.sh"

    # ── Verify, then tell the humans ─────────────────────────────────────────
    - name: Verify it actually went live
      id: verify
      if: steps.preflight.outputs.skip != 'true' && inputs.verify-url != ''
      shell: bash
      env:
        VERIFY_URL: ${{ inputs.verify-url }}
        VERIFY_HEADER: ${{ inputs.verify-header }}
        VERIFY_HEADER_MATCH: ${{ inputs.verify-header-match }}
        VERIFY_METHOD: ${{ inputs.verify-method }}
        EXPECT_STATUS: ${{ inputs.verify-status }}
        ATTEMPTS: ${{ inputs.verify-attempts }}
        DELAY: ${{ inputs.verify-delay }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/verify-live.sh"

    - name: Collect the outcome
      id: outcome
      if: always()
      shell: bash
      env:
        SKIP: ${{ steps.preflight.outputs.skip }}
        DOCS_SITE_DIR: ${{ steps.pages-build.outputs.site-dir }}
        S3_DEPLOYED: ${{ steps.deploy-s3.outputs.deployed }}
        LAMBDA_DEPLOYED: ${{ steps.deploy-lambda.outputs.deployed }}
        TG_DEPLOYED: ${{ steps.deploy-terragrunt.outputs.deployed }}
        CF_DEPLOYED: ${{ steps.deploy-cloudflare.outputs.deployed }}
        AZ_DEPLOYED: ${{ steps.deploy-azure-functions.outputs.deployed }}
        APIM_DEPLOYED: ${{ steps.deploy-azure-apim.outputs.deployed }}
        ANSIBLE_DEPLOYED: ${{ steps.deploy-ansible.outputs.deployed }}
        JOB_STATUS: ${{ job.status }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/collect-outcome.sh"

    - name: Notify, sticky pull-request comment
      # `always()` on every notification step. A deploy that failed is exactly when the humans
      # most need to be told, and a step without it is skipped the moment anything upstream
      # goes red. The terragrunt target keeps its own rolling comment, so it is excluded here
      # rather than commented on twice.
      if: always() && steps.preflight.outputs.skip != 'true' && github.event.pull_request.number && inputs.target != 'terragrunt' && (inputs.pr-comment == 'true' || (inputs.pr-comment == 'auto' && steps.resolve.outputs.mode == 'preview'))
      shell: bash
      env:
        AUTH_TOKEN: ${{ inputs.auth-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_KEY: ${{ inputs.target }}-${{ steps.resolve.outputs.environment }}
        STATUS: ${{ steps.outcome.outputs.status }}
        URL: ${{ steps.deploy-s3.outputs.url || steps.deploy-cloudflare.outputs.url || steps.deploy-azure-functions.outputs.url || steps.deploy-azure-apim.outputs.url }}
        VERSION: ${{ steps.deploy-lambda.outputs.version-id || steps.deploy-cloudflare.outputs.version-id || steps.deploy-azure-functions.outputs.version-id || steps.deploy-azure-apim.outputs.version-id }}
        VERIFIED: ${{ steps.verify.outputs.verified }}
        MODE: ${{ steps.resolve.outputs.mode }}
        TARGET: ${{ inputs.target }}
        ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/notify-pr-body.sh"

    - name: Notify, Slack and Teams
      if: always() && steps.preflight.outputs.skip != 'true'
      shell: bash
      env:
        SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
        TEAMS_WEBHOOK: ${{ inputs.teams-webhook }}
        NOTIFY: ${{ inputs.notify }}
        STATUS: ${{ steps.outcome.outputs.status }}
        TARGET: ${{ inputs.target }}
        MODE: ${{ steps.resolve.outputs.mode }}
        ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
        URL: ${{ steps.deploy-s3.outputs.url || steps.deploy-cloudflare.outputs.url || steps.deploy-azure-functions.outputs.url || steps.deploy-azure-apim.outputs.url }}
        VERSION: ${{ steps.deploy-lambda.outputs.version-id || steps.deploy-cloudflare.outputs.version-id || steps.deploy-azure-functions.outputs.version-id || steps.deploy-azure-apim.outputs.version-id }}
        VERIFIED: ${{ steps.verify.outputs.verified }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/notify-webhook.sh"

    - name: Record the deployment
      id: record
      if: always() && steps.preflight.outputs.skip != 'true' && inputs.api-url != ''
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        API_AUDIENCE: ${{ inputs.api-audience }}
        STATUS: ${{ steps.outcome.outputs.status }}
        TARGET: ${{ inputs.target }}
        MODE: ${{ steps.resolve.outputs.mode }}
        ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
        URL: ${{ steps.deploy-s3.outputs.url || steps.deploy-cloudflare.outputs.url || steps.deploy-azure-functions.outputs.url || steps.deploy-azure-apim.outputs.url }}
        VERSION: ${{ steps.deploy-lambda.outputs.version-id || steps.deploy-cloudflare.outputs.version-id || steps.deploy-azure-functions.outputs.version-id || steps.deploy-azure-apim.outputs.version-id }}
        VERIFIED: ${{ steps.verify.outputs.verified }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/record-deployment.sh"
