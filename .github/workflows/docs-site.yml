name: Docs

# Tremvok's own docs site — and the action's end-to-end test.
#
# This deliberately calls the action by local path (`uses: ./`) rather than by tag, so
# every pull request exercises the code IN THAT PR. Pinning `MagmaMoose/tremvok@v1` here
# would test the last release instead, which is the one thing a dogfood workflow must
# not do.
#
# Consumers CAN copy this file: it is the shape every GitHub Pages caller needs, because a
# composite action cannot declare `pages: write` or the `github-pages` environment. That is
# the only job Tremvok hands back to its caller. See docs/setup.md.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'action.yml'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'action.yml'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          target: github-pages
          checkout: 'false'
          # On a pull request `mode: auto` resolves to preview, and GitHub Pages has no
          # preview destination, so nothing is staged and the build itself is the check.
          # That is why this target needs no destination input of its own.

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
